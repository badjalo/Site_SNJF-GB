databases:
  - name: snjf-db
    databaseName: snjf_db
    user: snjf_user
    plan: free

services:
  - type: web
    name: snjf-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snjf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        value: ""
      - key: EMAIL_PASS
        value: ""

  - type: web
    name: snjf-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: snjf-backend
          envVarKey: RENDER_EXTERNAL_URL
